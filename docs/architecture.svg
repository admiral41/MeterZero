<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">MeterZero solution architecture</title>
  <desc id="desc">The React and Three.js frontend runs in the user's browser and communicates with MeterZero's FastAPI service and energy engine on Cloud Run. The backend uses Gemini for document reading and energy audit assistance. Secret Manager supplies the Gemini API key. Cloud Build builds the container, Artifact Registry stores it, and Cloud Run deploys it.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#536b80"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#4285f4"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#16836c"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#122b42}.section{font-size:16px;font-weight:700;letter-spacing:1.4px;fill:#61768a}.title{font-size:26px;font-weight:700}.body{font-size:19px;fill:#53677a}.small{font-size:16px;fill:#61768a}.card{fill:#fff;stroke:#d3dee7;stroke-width:2}.line{fill:none;stroke:#536b80;stroke-width:3;marker-end:url(#arrow)}.blue{fill:none;stroke:#4285f4;stroke-width:3;marker-end:url(#arrowBlue)}
    </style>
  </defs>
  <rect width="1440" height="860" fill="#fff"/>

  <text x="66" y="75" class="section">HOW METERZERO WORKS</text>

  <!-- Frontend -->
  <rect x="64" y="133" width="356" height="340" rx="20" class="card"/>
  <rect x="92" y="163" width="48" height="48" rx="13" fill="#e8f0fe"/>
  <rect x="103" y="174" width="26" height="20" rx="3" fill="none" stroke="#4285f4" stroke-width="2.5"/><path d="M108 201h16m-8-7v7" stroke="#4285f4" stroke-width="2.5" stroke-linecap="round"/>
  <text x="158" y="196" class="title">Frontend</text>
  <text x="94" y="258" class="body">React + Three.js</text>
  <line x1="94" y1="279" x2="390" y2="279" stroke="#e1e8ee" stroke-width="2"/>
  <text x="94" y="322" class="body">Overview and digital twin</text>
  <text x="94" y="364" class="body">Bills and savings analysis</text>
  <text x="94" y="406" class="body">Scenarios and AI assistant</text>
  <rect x="94" y="433" width="296" height="22" rx="11" fill="#edf4fb"/>
  <text x="242" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#315fa5">RUNS IN THE USER'S BROWSER</text>

  <!-- Cloud Run backend -->
  <rect x="542" y="112" width="356" height="361" rx="20" fill="#fff" stroke="#a9d2c4" stroke-width="2.5"/>
  <rect x="542" y="112" width="356" height="72" rx="20" fill="#eaf5f1"/>
  <path d="M542 164v20h356v-20" fill="#eaf5f1"/>
  <circle cx="580" cy="148" r="18" fill="#d4ece3"/><path d="M571 154l9-14 9 14z" fill="none" stroke="#16836c" stroke-width="2.5"/>
  <text x="612" y="156" class="title">Cloud Run</text>
  <text x="575" y="228" font-size="20" font-weight="700">FastAPI + MeterZero engine</text>
  <line x1="575" y1="250" x2="865" y2="250" stroke="#dce8e3" stroke-width="2"/>
  <text x="575" y="293" class="body">Machine-level energy estimates</text>
  <text x="575" y="335" class="body">Bill checks and tariff analysis</text>
  <text x="575" y="377" class="body">Savings and schedule scenarios</text>

  <!-- Gemini -->
  <rect x="1020" y="133" width="356" height="340" rx="20" fill="#fff" stroke="#c8d6f0" stroke-width="2"/>
  <circle cx="1063" cy="187" r="24" fill="#e8f0fe"/><path d="M1063 168l5 14 14 5-14 5-5 14-5-14-14-5 14-5z" fill="#4285f4"/>
  <text x="1104" y="196" class="title">Google Gemini</text>
  <line x1="1050" y1="235" x2="1346" y2="235" stroke="#e1e8f2" stroke-width="2"/>
  <text x="1050" y="280" class="body">Reads bills and logbooks</text>
  <text x="1050" y="310" class="body">Reads equipment nameplates</text>
  <text x="1050" y="352" class="body">Supports guided energy audits</text>
  <text x="1050" y="390" class="body">Explains findings clearly</text>
  <rect x="1050" y="411" width="296" height="39" rx="12" fill="#edf3ff"/>
  <text x="1198" y="437" text-anchor="middle" font-size="15" font-weight="700" fill="#315fa5">DOCUMENT + AI ANALYSIS</text>

  <!-- User/API round-trip -->
  <path d="M542 283H429" class="line"/>
  <rect x="431" y="252" width="108" height="25" rx="12" fill="#fff"/>
  <text x="485" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#53677a">Frontend</text>
  <path d="M420 368H533" class="line"/>
  <rect x="430" y="378" width="102" height="25" rx="12" fill="#fff"/>
  <text x="481" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#53677a">API calls</text>

  <!-- Gemini request and response -->
  <path d="M898 294H1012" class="blue"/>
  <path d="M1020 348H906" fill="none" stroke="#4285f4" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="902" y="260" width="118" height="25" rx="12" fill="#fff"/>
  <text x="961" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#315fa5">Gemini request</text>
  <rect x="905" y="357" width="108" height="25" rx="12" fill="#fff"/>
  <text x="959" y="375" text-anchor="middle" font-size="15" font-weight="700" fill="#315fa5">AI response</text>

  <!-- Secret Manager -->
  <path d="M720 518v-38" fill="none" stroke="#ad8b3d" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="542" y="518" width="356" height="70" rx="16" fill="#fffaf0" stroke="#e6d39f" stroke-width="2"/>
  <circle cx="578" cy="553" r="17" fill="#fff0c9"/><path d="M574 553a4 4 0 1 1 8 0v7h-8zM576 552v-4a2 2 0 0 1 4 0v4" fill="none" stroke="#a87919" stroke-width="2"/>
  <text x="610" y="551" font-size="19" font-weight="700">Secret Manager</text>
  <text x="610" y="573" class="small">Gemini API key for Cloud Run</text>

  <!-- Deployment flow -->
  <line x1="64" y1="635" x2="1376" y2="635" stroke="#e1e8ee" stroke-width="2"/>
  <text x="66" y="679" class="section">DEPLOYMENT FLOW</text>
  <rect x="64" y="705" width="348" height="82" rx="15" fill="#f8faff" stroke="#d5e0e8" stroke-width="2"/>
  <text x="94" y="740" font-size="20" font-weight="700">Cloud Build</text><text x="94" y="766" class="small">Builds the app container</text>
  <path d="M425 746h102" class="blue"/>
  <rect x="542" y="705" width="356" height="82" rx="15" fill="#f8faff" stroke="#d5e0e8" stroke-width="2"/>
  <text x="572" y="740" font-size="20" font-weight="700">Artifact Registry</text><text x="572" y="766" class="small">Stores the container image</text>
  <path d="M911 746h102" class="blue"/>
  <rect x="1028" y="705" width="348" height="82" rx="15" fill="#eef7f4" stroke="#b9dacf" stroke-width="2"/>
  <text x="1058" y="740" font-size="20" font-weight="700">Cloud Run</text><text x="1058" y="766" class="small">Runs the deployed app + API</text>
</svg>
